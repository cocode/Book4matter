# book_metadata.yaml
#
# WHAT the book is -- its identity, not its appearance. Title, author, rights,
# language: facts about the work that hold no matter how you style it. How the
# pages LOOK lives in book_style.yaml. (book4matter merges both files, so the
# split is a convention you keep for your own sanity, not a rule it enforces.)
#
# This file documents book4matter AND is a working book4matter book. From the
# project root:
#     Build this manual as a 6x9 print interior PDF:
#     ./run.sh print docs/
#     Build it as a digital PDF with live links:
#     ./run.sh pdf docs/
#     Build it as an EPUB:
#     ./run.sh epub docs/
#     Build it as one HTML page:
#     ./run.sh html docs/

title: "Book4matter"
subtitle: "Markdown to print, PDF, EPUB, and HTML"
# A string, or a YAML list of names.
author: "Thomas Hill"
# Used as the EPUB date (<dc:date>).
year: 2026
# Shown on the copyright page when set.
publisher: ""
# Copyright line on the copyright page.
rights: "© 2026 Thomas Hill."
# Copyright page + EPUB <dc:identifier> when set.
isbn: ""
# Cataloguing attribute; also drives hyphenation.
language: en
