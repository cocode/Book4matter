# book_metadata.yaml
#
# WHAT the book is -- its identity, not its appearance. Title, author, rights,
# language: facts about the work that hold no matter how you style it. How the
# pages LOOK lives in book_style.yaml. (book4matter merges both files, so the
# split is a convention you keep for your own sanity, not a rule it enforces.)
#
# This file documents book4matter AND is a working book4matter book. From the
# project root:
#     ./run.sh print docs/     # build this manual as a 6x9 interior PDF
#     ./run.sh epub  docs/     # ... or as an EPUB
#     ./run.sh html  docs/     # ... or as one HTML page

title: "Book4matter"
subtitle: "Markdown to print, EPUB, and HTML"
author: "Thomas Hill"          # a string, or a YAML list of names
year: 2026                     # used as the EPUB date (<dc:date>)
publisher: ""                  # shown on the copyright page when set
rights: "© 2026 Thomas Hill."  # copyright line on the copyright page
isbn: ""                       # copyright page + EPUB <dc:identifier> when set
language: en                   # cataloguing attribute; also drives hyphenation
