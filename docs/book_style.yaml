# book_style.yaml
#
# HOW the book looks -- appearance only. Page size, margins, fonts, and the
# optional page furniture. Point many books at one style file to restyle them
# all from a single place; the manuscript and its metadata never change.
#
# These docs deliberately use only fonts bundled in the Docker image, so they
# build with no font setup at all.

# KDP US trade paperback, or a {width, height} map.
trim: 6x9
# Inches; omit to let --pages pick a KDP-safe gutter.
margins:
  # Binding side -- wider; KDP scales this with page count.
  inside: 0.875
  outside: 0.625
  top: 0.75
  bottom: 0.75

# Body face; bundled in Typst, no setup needed.
font: "Libertinus Serif"
# Parts, chapters, headings; bundled in the image.
heading-font: "Liberation Sans"
# Body size.
font-size: 11pt

# Generate the Contents page.
toc: true
# Book title (verso) / chapter (recto); PDF outputs only.
running-heads: true
# Rule between title and subtitle on the title page.
title-rule: true
